name: Release

# Publishes to PyPI when a version tag (vX.Y.Z, PEP 440) is pushed.
#
# One-time setup (see README, "Releasing"):
#   * PyPI: add a trusted publisher for this repository, workflow "release.yml",
#     environment "pypi". No API token is created or stored anywhere.
#   * GitHub: create the "pypi" environment (Settings -> Environments).
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, to check the tag is on main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Refuse tags that are not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the built version matches the tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          from packaging.utils import parse_wheel_filename
          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          (wheel,) = pathlib.Path("dist").glob("*.whl")
          built = parse_wheel_filename(wheel.name)[1]
          try:
              tagged = Version(tag.removeprefix("v"))
          except InvalidVersion:
              sys.exit(f"::error::Tag {tag} is not a PEP 440 version (expected vX.Y.Z).")
          if tagged != built:
              sys.exit(
                  f"::error::Tag {tag} does not match the package version {built}. "
                  "Bump __version__ in src/llm_structured_extract/__init__.py first."
              )
          print(f"Tag {tag} matches the package version {built}.")
          PY

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c \
            "import llm_structured_extract as lse; print('imported', lse.__version__)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-structured-extract
    permissions:
      id-token: write # trusted publishing (OIDC) and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the distributions
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
