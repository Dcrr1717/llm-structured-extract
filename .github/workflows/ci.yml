name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # The suite is fully offline. No secrets are exposed to this job, and live tests
    # are skipped unless ANTHROPIC_API_KEY and LSE_RUN_LIVE_TESTS=1 are both set.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test (offline)
        run: pytest --cov --cov-report=term-missing

  lint:
    name: mypy + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: mypy (strict)
        run: mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
