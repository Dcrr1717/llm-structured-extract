[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-structured-extract"
dynamic = ["version"]
description = "Typed, schema-enforced structured extraction over LLMs: validation, repair-and-retry, provider-agnostic, offline-testable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "César Daniel Reinoso" }]
requires-python = ">=3.10"
keywords = ["llm", "structured-output", "extraction", "pydantic", "json-schema", "anthropic", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
jsonschema = ["jsonschema>=4.18"]
dev = [
    "llm-structured-extract[anthropic,jsonschema]",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-jsonschema",
]

[project.urls]
Repository = "https://github.com/Dcrr1717/llm-structured-extract"
Issues = "https://github.com/Dcrr1717/llm-structured-extract/issues"

[tool.hatch.version]
# Single source of truth: bump __version__ there, then tag vX.Y.Z (see README, "Releasing").
path = "src/llm_structured_extract/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_structured_extract"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
pythonpath = ["examples"]
addopts = ["-ra", "--strict-markers", "--doctest-modules"]
markers = ["live: calls a real, paid LLM API (skipped unless explicitly enabled)"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "examples"]
mypy_path = ["src", "examples"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
ignore = ["RET503", "RET505"]

[tool.ruff.lint.isort]
known-first-party = ["llm_structured_extract"]

[tool.coverage.run]
source = ["llm_structured_extract"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
